<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lattafa POS" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/pos.webmanifest" />
    <title>Lattafa POS</title>
    <script>
      // Apply saved theme/language before first paint so there is no flash.
      try {
        var p = JSON.parse(localStorage.getItem('lattafa-ui') || '{}').state || {};
        var d = document.documentElement;
        var dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) d.classList.add('dark');
        if (p.lang === 'ar' || p.lang === 'ku') { d.dir = 'rtl'; d.lang = p.lang === 'ku' ? 'ckb' : 'ar'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
