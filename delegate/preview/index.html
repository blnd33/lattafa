<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lattafa Delegate App — Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ───────── Lattafa design tokens (same as Store POS / Menu) ───────── */
:root{
  --gold:#D4A548; --gold-dark:#B8892F; --gold-light:#E9CD8A; --gold-soft:#F7EEDA;
  --ink:#1A1714; --charcoal:#2B2622; --ivory:#FBF8F2; --muted:#8A8178;
  --success:#3E8E5E; --danger:#C0453A; --warning:#D98E2B;
  --bg:#FBF8F2; --surface:#fff; --surface-2:#F5EFE3; --text:#1A1714; --text-2:#6F665D; --line:#EBDFC5; --gold-text:#8F6A1C;
  --img-bg:radial-gradient(circle at 50% 38%,#FFFBF0 0,#F7EEDA 72%);
  --shadow:0 6px 18px rgba(26,23,20,.07);
  --low-bg:#FCEBD3; --low-fg:#8A5410; --dan-bg:#F9E1DD; --dan-fg:#A23429; --ok-bg:#DDF0E4; --ok-fg:#2C7147;
  --map-land:#EFE7D6; --map-road:#FFFFFF; --map-block:#F6F0E2; --map-green:#DCE7D6; --map-water:#D8E4E8;
}
html[data-theme=dark]{
  --bg:#14110F; --surface:#201C18; --surface-2:#2B2622; --text:#F6F0E4; --text-2:#A89F93; --line:#3B342C; --gold-text:#E2BB6A;
  --img-bg:radial-gradient(circle at 50% 38%,#3D332A 0,#25201B 75%);
  --shadow:0 6px 18px rgba(0,0,0,.4);
  --low-bg:#4A3416; --low-fg:#F2C77A; --dan-bg:#4A2320; --dan-fg:#F2A59C; --ok-bg:#1F3A2A; --ok-fg:#7BD3A0;
  --map-land:#221E1A; --map-road:#3A332C; --map-block:#2A2521; --map-green:#26332A; --map-water:#22303A;
}
*{box-sizing:border-box;margin:0}
html,body{background:#0E0C0A}
body{font-family:Poppins,Tajawal,system-ui,sans-serif;color:#EDE6D8;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px} svg.i.lg{width:26px;height:26px}
html[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* preview shell */
.pv-bar{direction:ltr;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:12px 20px;background:#17130F;border-bottom:1px solid #2E271F;position:sticky;top:0;z-index:100}
.pv-title{font-family:'Playfair Display',serif;font-size:18px;color:#E9CD8A;display:flex;align-items:center;gap:10px}
.pv-title img{height:30px} .pv-title small{font-family:Poppins,sans-serif;font-size:12px;color:#9A9083}
.pv-tools{display:flex;gap:8px;flex-wrap:wrap}
.pv-tool{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#CFC5B4;padding:8px 14px;border:1px solid #3A3128;border-radius:999px}
.pv-tool[aria-pressed=true]{background:#D4A548;color:#1A1714;border-color:#D4A548;font-weight:600}
.pv-note{max-width:760px;margin:0 auto 34px;padding:0 20px;color:#8F857A;font-size:12.5px;text-align:center;line-height:1.7}
.phones{display:flex;flex-wrap:wrap;gap:34px 30px;justify-content:center;padding:28px 12px 30px}
.ph{width:410px;display:flex;flex-direction:column;gap:12px;align-items:center;zoom:var(--z,1)}
.ph figcaption{color:#CFC5B4;font-size:13px;letter-spacing:.04em}
.ph figcaption b{color:#E9CD8A;font-weight:600;margin-inline-end:6px}
.device{width:410px;height:864px;border-radius:56px;background:#0a0908;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 2px #2a2420}

/* app screen */
.scr{width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--text);position:relative;display:flex;flex-direction:column;font-size:14px;transition:background .25s}
html[dir=rtl] .scr{direction:rtl} html[dir=ltr] .scr{direction:ltr}
html[lang=ar] .scr,html[lang=ckb] .scr{font-family:Tajawal,Poppins,sans-serif}
.serif{font-family:'Playfair Display',Georgia,serif}
html[lang=ar] .serif,html[lang=ckb] .serif{font-family:Tajawal,sans-serif;font-weight:800}
.num{font-family:Poppins,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sb{height:34px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13px;font-weight:600;flex:none;direction:ltr;position:relative;z-index:2}
.sb .cam{position:absolute;left:50%;top:9px;width:14px;height:14px;border-radius:50%;background:#000;transform:translateX(-50%)}
.sb .r{display:flex;gap:6px;align-items:center}
.sb svg{width:15px;height:15px;fill:currentColor;stroke:none}
.gest{height:20px;display:grid;place-items:center;flex:none}
.gest i{width:120px;height:4px;border-radius:2px;background:var(--text);opacity:.35}

.login{--bg:#14110F;--surface:#201C18;--surface-2:#2B2622;--text:#F6F0E4;--text-2:#A89F93;--line:#3B342C;--gold-text:#E2BB6A;background:radial-gradient(120% 60% at 50% 0,#3A2E1C 0,#14110F 60%);color:var(--text)}
.content{flex:1;overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;min-height:0}
.content::-webkit-scrollbar{display:none}
.content>*{flex:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;gap:10px;flex:none}
.hdr h1{font-size:23px;font-weight:600;line-height:1.2;min-width:0}
.hdr h1.sm{font-size:18px}
.hdr small{display:block;color:var(--text-2);font-size:12.5px;font-weight:400;font-family:Poppins,Tajawal,sans-serif}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.warn{background:var(--low-bg);color:var(--low-fg)} .chip.ok{background:var(--ok-bg);color:var(--ok-fg)} .chip.dan{background:var(--dan-bg);color:var(--dan-fg)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--text-2)}
.btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15.5px;width:100%;transition:.15s}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-dark));color:var(--ink);box-shadow:0 8px 20px rgba(184,137,47,.32)}
.btn.ghost{background:var(--surface-2)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(26,23,20,.12)}
.seg.gold button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.field{display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);padding:0 14px;color:var(--text-2)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;color:var(--text)}
.field:focus-within{border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none}
.cchip{height:40px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap}
.cchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--gold-light)}
html[data-theme=dark] .cchip[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-light),var(--gold-dark))}
.bar.dan i{background:linear-gradient(90deg,#E8A29A,var(--danger))}

/* bottom nav (Material-3 style, 5 items, raised Sell) */
.nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:76px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px;flex:none;position:relative;z-index:3}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--text-2);min-height:56px;justify-content:center}
.nav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
.nav button[aria-current=page]{color:var(--gold-text);font-weight:600}
.nav button[aria-current=page] .pill{background:var(--gold-soft)}
html[data-theme=dark] .nav button[aria-current=page] .pill{background:#3A3020}
.nav .sellb{position:relative;top:-20px;min-height:auto}
.nav .fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(160deg,var(--gold-light),var(--gold-dark));color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(184,137,47,.45);border:4px solid var(--bg)}
.nav .sellb span:last-child{margin-top:2px}

/* login */
.login .mid{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 24px 0;gap:14px;min-height:0}
.login .logo{height:118px;margin-top:14px;filter:drop-shadow(0 8px 24px rgba(212,165,72,.3))}
.login h1{font-size:30px;font-weight:600;color:var(--gold-light);line-height:1.1}
.login .sub{color:var(--text-2);font-size:13.5px;margin-top:-8px}
.login .lang{position:absolute;top:44px;inset-inline-end:18px;direction:ltr}
.dots{display:flex;gap:16px;margin:16px 0 4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);transition:.15s}
.dots i.on{background:var(--gold);box-shadow:0 0 12px rgba(212,165,72,.6)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;direction:ltr;margin-top:6px}
.pad button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(233,205,138,.16);font-size:27px;font-family:Poppins,sans-serif;font-weight:500;display:grid;place-items:center;color:var(--text)}
.pad button:active{background:rgba(212,165,72,.25)}
.pad .ghost{background:none;border-color:transparent}
.bound{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin:auto 0 8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.05)}
.bound svg{color:var(--gold)}

/* home */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2B2622,#14110F);color:#F6F0E4;border-radius:24px;padding:18px;box-shadow:0 14px 30px rgba(26,23,20,.28);border:1px solid rgba(233,205,138,.18)}
html[data-theme=dark] .hero{background:linear-gradient(160deg,#2F2820,#1B1714)}
.hero .wm{position:absolute;inset-inline-end:-26px;top:-18px;height:190px;opacity:.09;pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#B9AE9C}
html[dir=rtl] .hero .lbl{letter-spacing:0}
.hero .big{font-size:38px;font-weight:600;color:var(--gold);line-height:1.15;margin:2px 0 14px}
.hero .big small{font-size:14px;color:#B9AE9C;font-family:Poppins,Tajawal,sans-serif;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(233,205,138,.2);padding-top:12px}
.kpis>div{padding:0 10px;border-inline-start:1px solid rgba(233,205,138,.15)} .kpis>div:first-child{border:0;padding-inline-start:0}
.kpis small{display:block;font-size:11.5px;color:#B9AE9C}.kpis b{font-size:16px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;min-height:88px;line-height:1.25;text-align:center}
.qa .ic{width:40px;height:40px;border-radius:14px;background:var(--gold-soft);color:#8F6A1C;display:grid;place-items:center}
html[data-theme=dark] .qa .ic{background:#3A3020;color:var(--gold-light)}
.vrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)} .vrow:last-child{border:0;padding-bottom:0}
.vrow .av{width:42px;height:42px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--gold-text);flex:none}
.vrow .t{flex:1;min-width:0;line-height:1.3;font-weight:600;font-size:14px} .vrow .t small{display:block;font-weight:400;color:var(--text-2);font-size:12px}

/* stock */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .card{padding:12px 14px} .sum small{display:block;color:var(--text-2);font-size:12px} .sum b{font-size:20px;font-weight:600}
.item{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.item .im{width:54px;height:64px;border-radius:12px;background:var(--img-bg);display:grid;place-items:center}
.item .im svg{height:54px;width:auto}
.item .t{font-weight:600;font-size:14.5px;line-height:1.3} .item .t small{display:block;font-weight:400;color:var(--text-2);font-size:12px;margin-top:2px}
.qty-b{min-width:54px;text-align:center;padding:6px 10px;border-radius:12px;background:var(--gold-soft);color:#6B4E12;font-weight:700;font-size:16px;line-height:1.1}
.qty-b small{display:block;font-size:10px;font-weight:500;color:#8F6A1C}
.qty-b.low{background:var(--dan-bg);color:var(--dan-fg)} .qty-b.low small{color:var(--dan-fg)}
html[data-theme=dark] .qty-b{background:#3A3020;color:var(--gold-light)}
.body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.xfab{position:absolute;inset-inline-end:16px;bottom:36px;height:56px;padding:0 20px;border-radius:18px;background:linear-gradient(180deg,var(--gold),var(--gold-dark));color:var(--ink);display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 12px 26px rgba(184,137,47,.45);z-index:4}

/* sale */
.cust{display:flex;flex-direction:column;gap:10px}
.cust .top{display:flex;align-items:center;gap:12px}
.cust .av{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);color:#8F6A1C;display:grid;place-items:center;flex:none}
.cust b{font-size:15px}
.sline{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sline:last-child{border:0}
.sline .im{width:48px;height:58px;border-radius:12px;background:var(--img-bg);display:grid;place-items:center}.sline .im svg{height:48px;width:auto}
.sline .t{font-weight:600;font-size:14px;line-height:1.3}.sline .t small{display:block;color:var(--text-2);font-weight:400;font-size:12px}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:14px;margin-top:6px}
.stepper button{width:44px;height:44px;display:grid;place-items:center;border-radius:14px}
.stepper button[disabled]{opacity:.3}
.stepper b{min-width:28px;text-align:center;font-size:15px}
.cap{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--low-bg);color:var(--low-fg);margin-top:4px}
.ls{text-align:end;font-weight:700;font-size:14px}
.tot .r{display:flex;justify-content:space-between;padding:4px 0;color:var(--text-2);font-size:13.5px}
.tot .r.g{color:var(--text);font-size:14px;padding-top:10px;margin-top:6px;border-top:1px solid var(--gold-light);align-items:baseline}
.tot .r.g b{font-size:28px;font-weight:600;color:#8F6A1C;line-height:1.1}
html[data-theme=dark] .tot .r.g b{color:var(--gold)}
.tot .r.grn span:last-child{color:var(--success);font-weight:600}
.sticky{padding:12px 16px 10px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
.btp{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--text-2)} .btp svg{color:#3B82F6}

/* customers + map */
.map{border-radius:20px;overflow:hidden;border:1px solid var(--line);height:212px;position:relative;flex:none}
.map svg{width:100%;height:100%;display:block}
.mp-land{fill:var(--map-land)}.mp-block{fill:var(--map-block)}.mp-green{fill:var(--map-green)}.mp-water{fill:var(--map-water)}
.mp-road{stroke:var(--map-road);fill:none;stroke-linecap:round}
.bubble{position:absolute;background:var(--ink);color:#F6F0E4;font-size:11.5px;padding:6px 10px;border-radius:10px;white-space:nowrap;border:1px solid rgba(233,205,138,.4);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.bubble b{color:var(--gold-light)}
.cus{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.cus .av{width:46px;height:46px;border-radius:15px;background:var(--gold-soft);color:#8F6A1C;display:grid;place-items:center}
html[data-theme=dark] .cus .av{background:#3A3020;color:var(--gold-light)}
.cus .t{font-weight:600;font-size:14.5px;line-height:1.3;min-width:0}.cus .t small{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--text-2);font-size:12px;margin-top:2px}
.cus .b{text-align:end;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
html[dir=rtl] .cus .b{align-items:flex-start}

/* closing */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px 14px}.kpi small{display:block;color:var(--text-2);font-size:12px}.kpi b{font-size:19px;font-weight:600;display:block;margin-top:2px}
.kpi.gold{background:linear-gradient(160deg,#2B2622,#14110F);border-color:rgba(233,205,138,.2);color:#F6F0E4}.kpi.gold small{color:#B9AE9C}.kpi.gold b{color:var(--gold)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.check:last-child{border:0;padding-bottom:0}
.check .ok{width:26px;height:26px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:grid;place-items:center;flex:none}
.check .ok svg{width:15px;height:15px;stroke-width:2.6}
.check .ok.w{background:var(--low-bg);color:var(--low-fg)}
.count-in{display:flex;align-items:center;gap:10px;height:56px;border-radius:14px;border:1.5px solid var(--gold);padding:0 14px;background:var(--surface-2)}
.count-in b{font-size:22px;font-weight:600;font-family:Poppins,sans-serif;direction:ltr}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--low-bg);color:var(--low-fg);font-size:13px;font-weight:500}
.credit{padding:9px 16px;text-align:center;font-size:10px;color:#8F857A;background:#0E0C0A;border-radius:0 0 0 0;direction:ltr;flex:none}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  return `<nav class="nav">${it.map(([k,i,l])=>k==='sell'

   :`<button ${active===k?'aria-current="page"':''}><span class="pill">${ic(i)}</span><span>${t(l)}</span></button>`).join('')}</nav>`}

   <div class="chips">${[['all','f_all'],['low','f_low'],['men','f_men'],['women','f_women'],['oud','f_oud']].map(([k,l])=>`<button class="cchip" data-act="cap" data-v="${k}" aria-pressed="${f===k}">${t(l)}</button>`).join('')}</div>

/* pricing for the sale screen (single source: PricingService on the server, mirrored offline) */
function sale(){
  let sub=0;lines.forEach(l=>{const v=byId[l.id];sub+=l.q*(S.plist==='w'?v.w:v.r)});
  const disc=r250(sub*.05),total=sub-disc;
  const paid=S.mode==='cash'?total:S.mode==='debt'?0:Math.min(S.partial,total);
  const due=total-paid,cus=CUS[0];
  return{sub,disc,total,paid,due,newBal:cus.bal+due,cus};
}
function sSale(){
  const s=sale(),c=s.cus,pct=Math.min(100,Math.round(s.newBal/c.lim*100));
  return `<div class="scr">${status()}
  <div class="hdr"><div class="row" style="gap:10px"><button class="icon-btn" aria-label="Back">${ic('back','flip')}</button><h1 class="serif">${t('new_sale')}</h1></div><span class="chip ok">${ic('bt','sm')}${t('bt_s')}</span></div>
  <div class="content" style="padding-bottom:10px">
   <div class="card cust" style="padding:12px 14px"><div class="top"><span class="av">${ic('store')}</span><div style="flex:1"><b>${c.n[S.lang]}</b><div class="muted" style="font-size:12px">${t(c.area)}</div></div>${ic('chev','flip')}</div>
     <div class="row" style="font-size:12.5px"><span class="muted">${t('balance')}</span><b class="num">${fmt(c.bal)} → ${fmt(s.newBal)}</b></div>
     <div class="bar ${s.newBal>c.lim*.8?'dan':''}"><i style="width:${pct}%"></i></div>
     <div class="row muted" style="font-size:11.5px"><span>${t('limit')}</span><span class="num">${fmt(c.lim)} ${t('iqd')}</span></div></div>
   <div class="seg"><button data-act="plist" data-v="w" aria-pressed="${S.plist==='w'}">${t('wholesale')}</button><button data-act="plist" data-v="r" aria-pressed="${S.plist==='r'}">${t('retail')}</button></div>
   <div class="card" style="padding:2px 14px">${lines.map((l,ix)=>{const v=byId[l.id],p=S.plist==='w'?v.w:v.r,atMax=l.q>=v.van;return `<div class="sline"><div class="im">${bottle(v)}</div><div><div class="t">${v.n[S.lang]}<small><span class="num">${v.ml} ml · ${fmt(p)}</span></small></div>
      <div class="stepper"><button data-act="dec" data-ix="${ix}" aria-label="−">${ic('minus','sm')}</button><b class="num">${l.q}</b><button data-act="inc" data-ix="${ix}" aria-label="+" ${atMax?'disabled':''}>${ic('plus','sm')}</button></div>${atMax?`<div class="cap">${ic('warn','sm')}${t('max_van',{n:'<span class="num">'+v.van+'</span>'})}</div>`:''}</div>
      <div class="ls num">${fmt(l.q*p)}</div></div>`}).join('')}</div>
  </div>
  <div class="sticky" style="gap:8px">
   <div class="row" style="font-size:12.5px;color:var(--text-2)"><span>${t('subtotal')} <span class="num">${fmt(s.sub)}</span></span><span style="color:var(--success);font-weight:600">${t('discount')} <span class="num">− ${fmt(s.disc)}</span></span></div>
   <div class="row" style="align-items:baseline"><span style="font-weight:500">${t('total')}</span><b class="serif num" style="font-size:28px;font-weight:600;color:var(--gold-text);line-height:1.1">${fmt(s.total)} <small style="font-size:12px;color:var(--text-2);font-family:Poppins,Tajawal,sans-serif;font-weight:500">${t('iqd')}</small></b></div>
   <div class="seg gold">${[['cash','cash'],['debt','debt'],['partial','partial']].map(([k,l])=>`<button data-act="mode" data-v="${k}" aria-pressed="${S.mode===k}" style="height:40px">${t(l)}</button>`).join('')}</div>
   ${S.mode==='partial'?`<div class="g2"><label class="field" style="flex-direction:column;align-items:stretch;height:auto;padding:6px 14px;gap:0"><span style="font-size:11.5px">${t('paid_now')}</span><input class="num" id="partial" inputmode="numeric" value="${fmt(s.paid)}" style="font-size:17px;font-weight:600;height:28px"></label><div class="field" style="flex-direction:column;align-items:stretch;height:auto;padding:6px 14px;gap:0;background:var(--surface-2)"><span style="font-size:11.5px">${t('due')}</span><b class="num" style="font-size:17px;height:28px;line-height:28px;color:var(--danger)">${fmt(s.due)}</b></div></div>`:''}
   <button class="btn gold" style="height:52px">${ic('bt')}${t('complete')}</button></div>${gest}${credit}</div>`}

function pin(x,y,c,on){return `<g transform="translate(${x} ${y})"><ellipse cy="2" rx="8" ry="3" fill="#000" opacity=".18"/><path d="M0 0c-9-11-14-17-14-24a14 14 0 1 1 28 0c0 7-5 13-14 24z" fill="${c}" ${on?'stroke="#1A1714" stroke-width="2"':''}/><circle cy="-24" r="5.2" fill="${on?'#1A1714':'#fff'}"/></g>`}

     <path class="mp-road" d="M-10 58 L370 62" stroke-width="9"/><path class="mp-road" d="M-10 158 C80 150 180 168 370 148" stroke-width="9"/><path class="mp-road" d="M144 -10 L148 230" stroke-width="9"/><path class="mp-road" d="M270 -10 L262 230" stroke-width="7"/><path class="mp-road" d="M68 -10 L80 230" stroke-width="6"/>
     <path d="M-10 58 L370 62" stroke="#D4A548" stroke-width="1.6" stroke-dasharray="7 7" fill="none" opacity=".7"/>
     <circle cx="176" cy="170" r="20" fill="#D4A548" opacity=".22"/><circle cx="176" cy="170" r="8" fill="#1A1714" stroke="#fff" stroke-width="3"/>
     ${CUS.map((c,i)=>pin(c.x,c.y,c.bal>c.lim?'#C0453A':'#D4A548',i===0)).join('')}
   </svg><span class="bubble" style="left:${CUS[0].x/358*100}%;top:${(CUS[0].y-56)/212*100}%;transform:translateX(-50%)"><b>${CUS[0].n[S.lang]}</b> · <span class="num">350k</span></span>
   <span class="chip" style="position:absolute;bottom:10px;inset-inline-start:10px;height:28px;background:var(--ink);color:#F6F0E4">${ic('nav','sm')}${t('you')}</span></div>
   ${CUS.map(c=>{const over=c.bal>c.lim;return `<div class="cus"><span class="av">${ic('store')}</span><div class="t">${c.n[S.lang]}<small>${ic('pin','sm')}${t(c.area)} · <span class="num">${c.km}</span> ${t('km')}</small></div><div class="b">${c.bal?`<span class="num" style="color:${over?'var(--danger)':'var(--text)'}">${fmt(c.bal)}</span><span class="chip ${over?'dan':'warn'}" style="height:22px;font-size:11px">${over?t('over'):t('owes')}</span>`:`<span class="chip ok" style="height:24px">${ic('check','sm')}${t('settled')}</span>`}</div></div>`}).join('')}
  </div>
  <button class="xfab">${ic('pin')}${t('add_cus')}</button></div>${nav('cus')}${gest}${credit}</div>`}

function sClose(){
  const cashS=740000,credS=500000,col=480000,exp=35000,expected=cashS+col-exp,counted=expected;
  return `<div class="scr">${status()}
  <div class="hdr"><h1 class="serif">${t('closing')}<small class="num">29 Sep 2026 · ${t('fullname')}</small></h1><button class="icon-btn" aria-label="Back">${ic('clip')}</button></div>
  <div class="content" style="padding-bottom:12px">
   <div class="g2"><div class="card kpi gold"><small>${t('sales_total')}</small><b class="num serif">${fmt(cashS+credS)}</b></div><div class="card kpi"><small>${t('collections')}</small><b class="num">${fmt(col)}</b></div></div>
   <div class="card"><div class="row" style="font-size:13px"><span>${t('cash_sales')}</span><b class="num">${fmt(cashS)}</b></div><div class="bar" style="margin:6px 0 12px"><i style="width:${cashS/(cashS+credS)*100}%"></i></div>
     <div class="row" style="font-size:13px"><span>${t('credit_sales')}</span><b class="num">${fmt(credS)}</b></div><div class="bar dan" style="margin-top:6px"><i style="width:${credS/(cashS+credS)*100}%"></i></div></div>
   <div class="card"><div class="row" style="font-size:13.5px;padding-bottom:8px;border-bottom:1px dashed var(--line)"><span class="muted">${t('expenses')}</span><b class="num">− ${fmt(exp)}</b></div>
     <div class="row" style="font-size:13.5px;padding:8px 0"><span class="muted">${t('exp_cash')}</span><b class="num" style="font-size:17px">${fmt(expected)}</b></div>
     <div class="muted" style="font-size:12px;margin:4px 2px 6px">${t('counted')}</div><div class="count-in">${ic('cash')}<b>${fmt(counted)}</b><span style="margin-inline-start:auto;font-size:12px;color:var(--text-2)">${t('iqd')}</span></div></div>
   <div class="card"><div class="check"><span class="ok">${ic('check')}</span>${t('c_sync')}</div><div class="check"><span class="ok">${ic('check')}</span>${t('c_stock')} · <span class="num muted">${t('rem_stock')}: 86</span></div><div class="check"><span class="ok w">${ic('warn')}</span>${t('c_visits')} · <span class="num">6 / 10</span></div></div>
   <div class="status">${ic('clock')}<span>${t('pending')}</span></div>
  </div>
  <div class="sticky"><button class="btn gold">${ic('send')}${t('send')}</button></div>${gest}${credit}</div>`}

const SCREENS=[['01','Login · device binding',sLogin],['02','Home · my day',sHome],['03','My stock · van only',sStock],['04','New sale · capped at van stock',sSale],['05','Customers · list & map',sCus],['06','Daily closing',sClose]];
function render(){
  const h=document.documentElement;h.lang=HL[S.lang];h.dir=S.lang==='en'?'ltr':'rtl';h.dataset.theme=S.theme;
  const solo=(location.hash.match(/^#(\d)$/)||[])[1]; /* e.g. index.html#4 shows only screen 04 */
  $('#phones').innerHTML=SCREENS.filter(s=>!solo||s[0]==='0'+solo).map(([n,cap,fn])=>`<figure class="ph"><div class="device">${fn()}</div><figcaption><b>${n}</b>${cap}</figcaption></figure>`).join('');
  $$('[data-act=lang]').forEach(b=>{if(b.closest('.pv-bar'))b.setAttribute('aria-pressed',b.dataset.v===S.lang)});
  const tb=$('[data-act=theme]');tb.setAttribute('aria-pressed',S.theme==='dark');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const v=a.dataset.v,ix=+a.dataset.ix;
  switch(a.dataset.act){
    case'lang':S.lang=v;break;
    case'theme':S.theme=S.theme==='dark'?'light':'dark';break;
    case'offline':S.offline=!S.offline;a.setAttribute('aria-pressed',S.offline);a.textContent=S.offline?'Offline (as in the field)':'Online';break;
    case'pin':if(v==='del')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=v;break;
    case'cap':S.cap=v;break;
    case'plist':S.plist=v;break;
    case'mode':S.mode=v;break;
    case'inc':{const l=lines[ix];if(l.q<byId[l.id].van)l.q++;break}
    case'dec':{const l=lines[ix];if(l.q>1)l.q--;break}
  }
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='partial'){S.partial=parseInt(e.target.value.replace(/\D/g,''))||0;render()}});
function fit(){const w=innerWidth-24;document.documentElement.style.setProperty('--z',Math.min(1,w/410))}
addEventListener('resize',fit);fit();render();
</script>
