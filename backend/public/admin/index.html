    <script>
      // Apply saved theme/language before first paint so there is no flash (shared with the POS).
      try {
        var p = JSON.parse(localStorage.getItem('lattafa-ui') || '{}').state || {};
        var d = document.documentElement;
        var dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) d.classList.add('dark');
        if (p.lang === 'ar' || p.lang === 'ku') { d.dir = 'rtl'; d.lang = p.lang === 'ku' ? 'ckb' : 'ar'; }
      } catch (e) {}
    </script>
